name: Build Release Archive

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Package project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # нужен полный список файлов для git archive
          fetch-depth: 1

      - name: Determine version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build archive via .gitattributes export-ignore
        run: |
          mkdir -p dist
          NAME="railway-sim-${{ steps.ver.outputs.version }}"
          git archive --format=zip --prefix="$NAME/" \
            -o "dist/$NAME.zip" HEAD
          ls -lh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: railway-sim-archive
          path: dist/*.zip
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
